async function sha256(str) {
  const buf = await crypto.subtle.digest(
    "SHA-256", new TextEncoder().encode(str)
  );
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

function mountApp() {
  const lock = document.getElementById("lock-screen");
  if (lock) lock.remove();
  stlite.mount(
    {
      requirements: ["pandas", "openpyxl"],
      entrypoint: "app.py",
      files: {
  
      "app.py": "\"\"\"Easoft customer register conversion tool - Streamlit UI.\"\"\"\nfrom __future__ import annotations\n\nimport io\nimport json\n\nimport pandas as pd\nimport streamlit as st\n\nfrom config.erp_options import FIXED_OPTION_FIELDS\nfrom config.field_synonyms import (\n    ERP_FIELD_ORDER,\n    ERP_REQUIRED_FIELDS,\n    FIELD_VALUE_PATTERNS,\n    FREE_TEXT_VALUE_FIELDS,\n)\nfrom config.locales import LOCALES, LANGUAGE_NAMES\nfrom converter.column_mapper import auto_map\nfrom converter.exporter import build_output, to_csv_bytes, to_zip_bytes\nfrom converter.file_reader import (\n    SUPPORTED_FORMATS,\n    apply_header,\n    detect_header_row,\n    load_file,\n)\nfrom converter.transformer import (\n    build_transformed_df,\n    clean_value,\n    looks_like_fennoa_nro,\n    merge_multi_mapped_columns,\n    split_combined_column,\n)\nfrom converter.value_mapper import guess_fixed_option\n\n_MAX_VALUEMAP_ROWS = 200\n\nst.set_page_config(page_title=\"Easoft-asiakasrekisterin muuntotyökalu\", layout=\"wide\")\n\n\n# ── helpers ──────────────────────────────────────────────────────────────────\n\ndef _style_raw(raw: pd.DataFrame, header_row: int):\n    def _row_style(row):\n        if row.name == header_row:\n            return [\"background-color: #c6efce; font-weight: bold\"] * len(row)\n        if row.name < header_row:\n            return [\"color: #999999; font-style: italic\"] * len(row)\n        return [\"\"] * len(row)\n    return raw.style.apply(_row_style, axis=1)\n\n\ndef _drop_empty_columns(df: pd.DataFrame) -> pd.DataFrame:\n    empty = df.apply(lambda col: col.isna().all() or col.astype(str).str.strip().eq(\"\").all())\n    return df.loc[:, ~empty]\n\n\ndef _fields_with_multiple_sources(mapping: dict[str, str]) -> dict[str, list[str]]:\n    by_field: dict[str, list[str]] = {}\n    for src, field_ in mapping.items():\n        if field_:\n            by_field.setdefault(field_, []).append(src)\n    return {f: cols for f, cols in by_field.items() if len(cols) > 1}\n\n\ndef _fingerprint(**kwargs) -> str:\n    return json.dumps(kwargs, sort_keys=True, default=str)\n\n\ndef _style_issues(final: pd.DataFrame, error_rows: set, warning_rows: set):\n    def _row_style(row):\n        if row.name in error_rows:\n            return [\"background-color: #ffcccc\"] * len(row)\n        if row.name in warning_rows:\n            return [\"background-color: #fff3cd\"] * len(row)\n        return [\"\"] * len(row)\n    return final.style.apply(_row_style, axis=1)\n\n\n# ── sidebar / language ────────────────────────────────────────────────────────\n\nlang = st.sidebar.selectbox(\n    \"Kieli / Language\",\n    options=list(LANGUAGE_NAMES.keys()),\n    format_func=lambda k: LANGUAGE_NAMES[k],\n)\nt = LOCALES[lang]\n\nst.title(t[\"app_title\"])\nst.caption(t[\"app_caption\"])\n\n# ── Section 1: upload ─────────────────────────────────────────────────────────\n\nst.header(t[\"sec1_header\"])\nuploaded = st.file_uploader(\n    t[\"file_uploader_label\"],\n    type=SUPPORTED_FORMATS,\n    help=t[\"file_uploader_help\"].format(formats=\", \".join(SUPPORTED_FORMATS)),\n)\nif uploaded is None:\n    st.stop()\n\ntry:\n    loaded = load_file(io.BytesIO(uploaded.getvalue()), uploaded.name)\nexcept Exception as e:\n    st.error(t[\"file_load_error\"].format(error=e))\n    st.stop()\n\nraw = loaded.raw\nfile_id = f\"{uploaded.name}_{uploaded.size}\"\n\n# ── Section 2: column mapping ─────────────────────────────────────────────────\n\nst.header(t[\"sec2_header\"])\n\nwith st.expander(t[\"expander_label\"], expanded=True):\n    default_header_row = detect_header_row(raw)\n    header_row = st.number_input(\n        t[\"header_row_label\"],\n        min_value=0,\n        max_value=max(len(raw) - 1, 0),\n        value=min(default_header_row, max(len(raw) - 1, 0)),\n        help=t[\"header_row_help\"],\n        key=f\"header_row_{file_id}\",\n    )\n\n    show_all = st.checkbox(t[\"show_all_rows\"], key=f\"show_all_{file_id}\")\n    preview_n = len(raw) if show_all else min(len(raw), header_row + 15)\n    st.dataframe(_style_raw(raw.iloc[:preview_n], header_row), use_container_width=True)\n\n    df = apply_header(raw, header_row)\n    df = _drop_empty_columns(df)\n\n    st.caption(t[\"header_caption\"].format(row=header_row, rows=len(df), cols=len(df.columns)))\n\n    # ── combined fields ──\n    # Note: a plain bordered container, not st.expander - expanders can't be\n    # nested inside the outer \"expander_label\" expander above (Streamlit\n    # raises StreamlitAPIException: \"Expanders may not be nested\").\n    with st.container(border=True):\n        st.markdown(f\"**{t['combined_expander']}**\")\n        st.caption(t[\"combined_help\"])\n        forced_mapping: dict[str, str] = {}\n        source_cols_pre = list(df.columns)\n\n        c1, c2 = st.columns(2)\n        with c1:\n            st.markdown(f\"**{t['combined_einvoice_subheader']}**\")\n            einvoice_options = [\"none\", \"einvoice_space\", \"einvoice_name_paren\", \"einvoice_email_or_ovt\", \"einvoice_at_sign\"]\n            einvoice_mode = st.selectbox(\n                t[\"combined_field_type_label\"],\n                options=einvoice_options,\n                format_func=lambda k: t[\"combined_field_none\"] if k == \"none\" else t[\"combined_field_types\"][k],\n                key=f\"einvoice_mode_{file_id}\",\n            )\n            email_target = \"Email\"\n            if einvoice_mode != \"none\":\n                einvoice_col = st.selectbox(\n                    t[\"combined_field_col_label\"], options=source_cols_pre, key=f\"einvoice_col_{file_id}\"\n                )\n                if einvoice_mode == \"einvoice_email_or_ovt\":\n                    email_target = st.selectbox(\n                        t[\"combined_einvoice_email_target_label\"],\n                        options=[\"Email\", \"Laskutus email\"],\n                        key=f\"einvoice_email_target_{file_id}\",\n                    )\n                for label, (target_field, series) in split_combined_column(\n                    df[einvoice_col], einvoice_mode, email_target=email_target\n                ).items():\n                    df[label] = series\n                    forced_mapping[label] = target_field\n\n        with c2:\n            st.markdown(f\"**{t['combined_address_subheader']}**\")\n            address_options = [\"none\", \"address_zip_city\"]\n            address_mode = st.selectbox(\n                t[\"combined_field_type_label\"],\n                options=address_options,\n                format_func=lambda k: t[\"combined_field_none\"] if k == \"none\" else t[\"combined_field_types\"][k],\n                key=f\"address_mode_{file_id}\",\n            )\n            if address_mode != \"none\":\n                address_col = st.selectbox(\n                    t[\"combined_field_col_label\"], options=source_cols_pre, key=f\"address_col_{file_id}\"\n                )\n                for label, (target_field, series) in split_combined_column(df[address_col], address_mode).items():\n                    df[label] = series\n                    forced_mapping[label] = target_field\n\n        if forced_mapping:\n            st.caption(t[\"combined_result_caption\"].format(cols=\", \".join(forced_mapping.keys())))\n\n    # ── auto-mapping + editable table ──\n    source_cols = list(df.columns)\n    auto_toggle = st.checkbox(t[\"auto_map_label\"], value=True, help=t[\"auto_map_help\"], key=f\"auto_map_{file_id}\")\n    sample_values = {c: df[c].head(25).tolist() for c in source_cols}\n    suggested = auto_map(source_cols, sample_values) if auto_toggle else {c: \"\" for c in source_cols}\n    suggested.update(forced_mapping)\n\n    mapping_df = pd.DataFrame({\n        t[\"source_col_header\"]: source_cols,\n        t[\"erp_field_header\"]: [suggested.get(c, \"\") for c in source_cols],\n    })\n    edited = st.data_editor(\n        mapping_df,\n        column_config={\n            t[\"erp_field_header\"]: st.column_config.SelectboxColumn(\n                t[\"erp_field_header\"], options=[\"\"] + ERP_FIELD_ORDER\n            ),\n        },\n        hide_index=True,\n        use_container_width=True,\n        key=f\"mapping_editor_{file_id}_{header_row}_{len(source_cols)}_{einvoice_mode}_{address_mode}_{email_target}\",\n    )\n    mapping: dict[str, str] = dict(zip(edited[t[\"source_col_header\"]], edited[t[\"erp_field_header\"]]))\n    mapping = {src: (field_ or \"\") for src, field_ in mapping.items()}\n\n    # Y-tunnus sanity check\n    ytunnus_src = next((s for s, f in mapping.items() if f == \"Y-tunnus\"), None)\n    if ytunnus_src:\n        import re as _re\n        pattern = _re.compile(FIELD_VALUE_PATTERNS.get(\"Y-tunnus\", \".*\"))\n        vals = [str(v).strip() for v in df[ytunnus_src].head(50).tolist() if str(v).strip()]\n        if vals and (sum(1 for v in vals if pattern.fullmatch(v)) / len(vals)) < 0.5:\n            st.warning(t[\"ytunnus_warning\"].format(col=ytunnus_src))\n\n    # duplicate / multi-source fields → merge order\n    multi = _fields_with_multiple_sources(mapping)\n    merge_order: dict[str, list[str]] = {}\n    for erp_field, cols in multi.items():\n        st.warning(t[\"dup_warning\"].format(field=erp_field, cols=\", \".join(cols), first=cols[0]))\n        st.caption(f\"**{erp_field}** – \" + t[\"nimi_merge_caption\"])\n        order_df = pd.DataFrame({\n            t[\"source_col_header\"]: cols,\n            t[\"order_col_header\"]: list(range(1, len(cols) + 1)),\n        })\n        edited_order = st.data_editor(\n            order_df, hide_index=True, key=f\"order_{erp_field}_{file_id}_{header_row}\"\n        )\n        merge_order[erp_field] = list(\n            edited_order.sort_values(t[\"order_col_header\"])[t[\"source_col_header\"]]\n        )\n\n    nimi_ok = \"Nimi\" in mapping.values()\n    badge = \":green[✓ Nimi]\" if nimi_ok else \":red[✗ Nimi]\"\n    st.markdown(t[\"required_fields_label\"] + \" \" + badge)\n\n# ── Section 3: value mapping ──────────────────────────────────────────────────\n\nst.header(t[\"sec_valuemap_header\"])\n\n\ndef _source_for_field(erp_field: str) -> str | None:\n    return next((s for s, f in mapping.items() if f == erp_field), None)\n\n\ndef _distinct_values(col: str) -> list[str]:\n    vals = sorted({clean_value(v) for v in df[col].tolist()} - {\"\"})\n    if len(vals) > _MAX_VALUEMAP_ROWS:\n        st.warning(t[\"valuemap_truncated_notice\"].format(n=_MAX_VALUEMAP_ROWS))\n        vals = vals[:_MAX_VALUEMAP_ROWS]\n    return vals\n\n\nfixed_rows = []\nfor vm_field, vm_options in FIXED_OPTION_FIELDS.items():\n    vm_src = _source_for_field(vm_field)\n    if not vm_src:\n        continue\n    vm_vals = _distinct_values(vm_src)\n    if vm_vals:\n        fixed_rows.append((vm_field, vm_options, vm_src, vm_vals))\n\nfreetext_rows = []\nfor vm_field in FREE_TEXT_VALUE_FIELDS:\n    vm_src = _source_for_field(vm_field)\n    if not vm_src:\n        continue\n    vm_vals = _distinct_values(vm_src)\n    if vm_vals:\n        freetext_rows.append((vm_field, vm_src, vm_vals))\n\nvalue_maps: dict[str, dict[str, str]] = {}\n\nif fixed_rows:\n    st.subheader(t[\"valuemap_fixed_subheader\"])\n    st.caption(t[\"valuemap_fixed_help\"])\n    for vm_field, vm_options, vm_src, vm_vals in fixed_rows:\n        option_labels = [t[\"valuemap_unresolved_option\"]] + [\n            f\"{label} ({code})\" for label, code in vm_options.items()\n        ]\n        code_for_label = {f\"{label} ({code})\": code for label, code in vm_options.items()}\n\n        defaults = []\n        for v in vm_vals:\n            guess = guess_fixed_option(v, vm_options)\n            defaults.append(f\"{guess} ({vm_options[guess]})\" if guess else t[\"valuemap_unresolved_option\"])\n\n        st.markdown(f\"**{vm_field}** ({t['source_col_header']}: {vm_src})\")\n        vm_df = pd.DataFrame({\n            t[\"valuemap_source_header\"]: vm_vals,\n            t[\"valuemap_target_header\"]: defaults,\n        })\n        edited_vm = st.data_editor(\n            vm_df,\n            column_config={\n                t[\"valuemap_target_header\"]: st.column_config.SelectboxColumn(\n                    t[\"valuemap_target_header\"], options=option_labels\n                ),\n            },\n            hide_index=True,\n            use_container_width=True,\n            key=f\"valuemap_fixed_{vm_field}_{file_id}_{header_row}_{vm_src}\",\n        )\n        value_maps[vm_field] = {\n            src_val: (\"\" if target == t[\"valuemap_unresolved_option\"] else code_for_label.get(target, \"\"))\n            for src_val, target in zip(edited_vm[t[\"valuemap_source_header\"]], edited_vm[t[\"valuemap_target_header\"]])\n        }\n\nif freetext_rows:\n    st.subheader(t[\"valuemap_freetext_subheader\"])\n    st.caption(t[\"valuemap_freetext_help\"])\n    for vm_field, vm_src, vm_vals in freetext_rows:\n        st.markdown(f\"**{vm_field}** ({t['source_col_header']}: {vm_src})\")\n        vm_df = pd.DataFrame({\n            t[\"valuemap_source_header\"]: vm_vals,\n            t[\"valuemap_target_header\"]: vm_vals,\n        })\n        edited_vm = st.data_editor(\n            vm_df,\n            hide_index=True,\n            use_container_width=True,\n            key=f\"valuemap_free_{vm_field}_{file_id}_{header_row}_{vm_src}\",\n        )\n        value_maps[vm_field] = dict(\n            zip(edited_vm[t[\"valuemap_source_header\"]], edited_vm[t[\"valuemap_target_header\"]])\n        )\n\nif not fixed_rows and not freetext_rows:\n    st.info(t[\"valuemap_none_info\"])\n\n# ── Section 4: defaults and settings ──────────────────────────────────────────\n\nst.header(t[\"sec4_header\"])\n\nnro_sources = [s for s, f in mapping.items() if f == \"Nro\"]\ncol1, col2 = st.columns(2)\n\nwith col1:\n    st.subheader(t[\"nro_subheader\"])\n    fix_fennoa = False\n    auto_start = None\n    auto_interval = 1\n    if nro_sources:\n        st.caption(t[\"nro_mapped_caption\"].format(col=nro_sources[0]))\n        nro_mode = \"mapped\"\n        sample_nro = df[nro_sources[0]].head(50).tolist()\n        if looks_like_fennoa_nro(sample_nro):\n            fix_fennoa = st.checkbox(\n                t[\"fennoa_fix_label\"], value=True, help=t[\"fennoa_fix_help\"], key=f\"fennoa_{file_id}\"\n            )\n    else:\n        nro_mode = st.radio(\n            t[\"nro_mode_label\"],\n            options=[\"empty\", \"auto\"],\n            format_func=lambda k: t[\"nro_mode_options\"][k],\n            key=f\"nro_mode_{file_id}\",\n        )\n        if nro_mode == \"auto\":\n            c_start, c_int = st.columns(2)\n            auto_start = c_start.number_input(t[\"nro_start_label\"], min_value=1, value=1000, key=f\"nro_start_{file_id}\")\n            auto_interval = c_int.number_input(t[\"nro_interval_label\"], min_value=1, value=10, key=f\"nro_int_{file_id}\")\n\nwith col2:\n    _maa_options = FIXED_OPTION_FIELDS[\"Asiakkaan maa\"]\n    _default_country_options = [t[\"default_country_none_option\"]] + [\n        f\"{label} ({code})\" for label, code in _maa_options.items()\n    ]\n    _default_country_lookup = {f\"{label} ({code})\": code for label, code in _maa_options.items()}\n    _default_country_choice = st.selectbox(\n        t[\"default_country_label\"],\n        options=_default_country_options,\n        help=t[\"default_country_help\"],\n        key=f\"default_country_{file_id}\",\n    )\n    default_country = _default_country_lookup.get(_default_country_choice, \"\")\n\n    ryhma_default = st.text_input(t[\"ryhma_default_label\"], help=t[\"ryhma_default_help\"], key=f\"ryhma_{file_id}\")\n    fix_einvoice = st.checkbox(\n        t[\"einvoice_fix_label\"], value=True, help=t[\"einvoice_fix_help\"], key=f\"einvoice_fix_{file_id}\"\n    )\n\nerror_mode = st.radio(\n    t[\"error_handling_label\"],\n    options=[\"sisällytä\", \"poista\", \"erillinen tiedosto\"],\n    format_func=lambda k: t[\"error_handling_options\"][k],\n    captions=[t[\"error_handling_captions\"][k] for k in (\"sisällytä\", \"poista\", \"erillinen tiedosto\")],\n    key=f\"error_mode_{file_id}\",\n)\nallow_empty_cols = st.checkbox(\n    t[\"allow_empty_cols_label\"], help=t[\"allow_empty_cols_help\"], key=f\"allow_empty_{file_id}\"\n)\n\n# ── Section 5: output field selection ─────────────────────────────────────────\n\nst.header(t[\"sec5_header\"])\nst.markdown(t[\"required_always_label\"] + \" \" + \", \".join(ERP_REQUIRED_FIELDS))\n\nmapped_fields = {f for f in mapping.values() if f} | {\"Nro\", \"Ryhmä\"}\noptional_candidates = [\n    f for f in ERP_FIELD_ORDER\n    if f not in ERP_REQUIRED_FIELDS and (allow_empty_cols or f in mapped_fields)\n]\nselected_optional = st.multiselect(\n    t[\"optional_fields_label\"],\n    options=optional_candidates,\n    default=[f for f in optional_candidates if f in mapped_fields],\n    help=t[\"optional_fields_help\"],\n    key=f\"optional_fields_{file_id}\",\n)\nif not selected_optional:\n    st.info(t[\"no_optional_info\"])\n\n# ── Section 6: preview and export ─────────────────────────────────────────────\n\nst.header(t[\"sec6_header\"])\n\nbuild_key = _fingerprint(\n    file_id=file_id,\n    header_row=header_row,\n    mapping=mapping,\n    merge_order=merge_order,\n    ryhma_default=ryhma_default,\n    nro_mode=nro_mode,\n    auto_start=auto_start,\n    auto_interval=auto_interval,\n    fix_fennoa=fix_fennoa,\n    fix_einvoice=fix_einvoice,\n    value_maps=value_maps,\n    default_country=default_country,\n    error_mode=error_mode,\n    selected_optional=selected_optional,\n    lang=lang,\n)\n\nif st.button(t[\"build_button\"]):\n    try:\n        merged_df, merged_mapping = merge_multi_mapped_columns(df, mapping, merge_order)\n        result = build_transformed_df(\n            merged_df,\n            merged_mapping,\n            ryhma_default=ryhma_default,\n            nro_mode=nro_mode,\n            auto_nro_start=auto_start,\n            auto_nro_interval=auto_interval,\n            fix_fennoa_nro=fix_fennoa,\n            fix_einvoice_zeros=fix_einvoice,\n            value_maps=value_maps,\n            default_country=default_country,\n            messages=t[\"validation_messages\"],\n        )\n        st.session_state[\"build_result\"] = {\"key\": build_key, \"df\": result.df, \"issues\": result.issues}\n    except Exception as e:\n        st.error(t[\"transform_error\"].format(error=e))\n\nbr = st.session_state.get(\"build_result\")\nif br:\n    if br[\"key\"] != build_key:\n        st.info(t[\"stale_result_notice\"])\n\n    result_df = br[\"df\"]\n    issues = br[\"issues\"]\n    errors = [i for i in issues if i.level == \"error\"]\n    warnings_ = [i for i in issues if i.level == \"warning\"]\n\n    if errors:\n        st.error(t[\"errors_found\"].format(n=len(errors)))\n    if warnings_:\n        st.warning(t[\"warnings_found\"].format(n=len(warnings_)))\n\n    error_row_idx = sorted({i.row_idx for i in errors})\n    warning_row_idx = {i.row_idx for i in warnings_}\n\n    out_df = result_df\n    if error_mode == \"poista\" and error_row_idx:\n        out_df = out_df.drop(index=error_row_idx)\n        st.info(t[\"errors_removed\"].format(n=len(error_row_idx)))\n\n    with st.expander(t[\"validation_expander\"]):\n        if issues:\n            issues_df = pd.DataFrame([\n                {\n                    t[\"issue_col_row\"]: i.row_idx + 1,\n                    t[\"issue_col_field\"]: i.field,\n                    t[\"issue_col_level\"]: t[\"issue_level_error\"] if i.level == \"error\" else t[\"issue_level_warning\"],\n                    t[\"issue_col_message\"]: i.message,\n                }\n                for i in issues\n            ])\n            st.dataframe(issues_df, hide_index=True, use_container_width=True)\n\n    final = build_output(out_df, selected_optional, language=lang)\n    st.markdown(t[\"preview_label\"].format(rows=len(final), cols=len(final.columns)))\n    st.dataframe(\n        _style_issues(final, set(error_row_idx), warning_row_idx),\n        use_container_width=True,\n    )\n\n    if error_mode == \"erillinen tiedosto\" and error_row_idx:\n        main_df = build_output(result_df.drop(index=error_row_idx), selected_optional, language=lang)\n        error_df = build_output(result_df.loc[error_row_idx], selected_optional, language=lang)\n        zip_bytes = to_zip_bytes({\n            \"asiakkaat.csv\": to_csv_bytes(main_df),\n            \"asiakkaat_error.csv\": to_csv_bytes(error_df),\n        })\n        st.download_button(\n            t[\"download_zip\"].format(n=len(error_row_idx)),\n            data=zip_bytes,\n            file_name=\"asiakkaat.zip\",\n            mime=\"application/zip\",\n        )\n    else:\n        st.download_button(\n            t[\"download_csv\"],\n            data=to_csv_bytes(final),\n            file_name=\"asiakkaat.csv\",\n            mime=\"text/csv\",\n        )\n",

      "converter/file_reader.py": "\"\"\"Reads xlsx/xls/csv/ods files and detects the header row.\n\nOnly the first sheet of a workbook is used - customer registers handed to us\nhave always been single-sheet exports (any additional sheets seen in the wild\nhave been unrelated lookup tables, not more customer rows).\n\"\"\"\nfrom __future__ import annotations\n\nimport io\nimport re\nfrom pathlib import Path\nfrom typing import NamedTuple\n\nimport pandas as pd\n\ntry:\n    import xlrd as _xlrd  # noqa: F401\n    _HAS_XLS = True\nexcept ImportError:\n    _HAS_XLS = False\n\ntry:\n    import odf as _odf  # noqa: F401\n    _HAS_ODS = True\nexcept ImportError:\n    _HAS_ODS = False\n\nSUPPORTED_FORMATS = (\n    [\"xlsx\", \"csv\"]\n    + ([\"xls\"] if _HAS_XLS else [])\n    + ([\"ods\"] if _HAS_ODS else [])\n)\n\n# Candidate encodings tried for CSV files, roughly most-to-least common in the\n# customer registers we've seen. Single-byte encodings (latin-1, cp1252, cp850)\n# never raise UnicodeDecodeError - any byte sequence decodes \"successfully\" -\n# so a naive first-match strategy would happily accept a wrong one. See\n# _score_encoding() for how a wrong guess is actually detected.\n_CSV_ENCODINGS = (\"utf-8-sig\", \"utf-8\", \"cp1252\", \"latin-1\", \"cp850\")\n_CSV_SEPARATORS = (\";\", \",\", \"\\t\", \"|\")\n\n_FLOAT_SUFFIX_RE = re.compile(r\"^-?\\d+\\.0$\")\n\n\nclass LoadedFile(NamedTuple):\n    sheet_name: str\n    raw: pd.DataFrame  # full raw dataframe of the first sheet (no header applied)\n\n\ndef load_file(file_obj: io.BytesIO, filename: str) -> LoadedFile:\n    \"\"\"Load the first sheet of an uploaded file into a raw DataFrame (no header applied).\"\"\"\n    suffix = Path(filename).suffix.lower()\n\n    if suffix in (\".xlsx\", \".xlsm\"):\n        xf = pd.ExcelFile(file_obj, engine=\"openpyxl\")\n    elif suffix == \".xls\":\n        if not _HAS_XLS:\n            raise ValueError(\"XLS-tiedostot eivät ole tuettuja tässä versiossa. Muunna tiedosto XLSX-muotoon.\")\n        xf = pd.ExcelFile(file_obj, engine=\"xlrd\")\n    elif suffix == \".ods\":\n        if not _HAS_ODS:\n            raise ValueError(\"ODS-tiedostot eivät ole tuettuja tässä versiossa. Muunna tiedosto XLSX-muotoon.\")\n        xf = pd.ExcelFile(file_obj, engine=\"odf\")\n    elif suffix == \".csv\":\n        raw = _read_csv_raw(file_obj)\n        return LoadedFile(sheet_name=\"CSV\", raw=_clean_float_suffixes(raw))\n    else:\n        raise ValueError(f\"Tiedostomuoto ei tuettu: {suffix}\")\n\n    sheet_name = xf.sheet_names[0]\n    raw = xf.parse(sheet_name, header=None, dtype=str)\n    return LoadedFile(sheet_name=sheet_name, raw=_clean_float_suffixes(raw))\n\n\ndef _clean_float_suffixes(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Strip a bare '.0' left behind when Excel stored a text-like value (postal\n    code, phone number, e-invoice address) as a number instead of text.\"\"\"\n    return df.map(lambda v: _FLOAT_SUFFIX_RE.sub(\"\", v) if isinstance(v, str) and _FLOAT_SUFFIX_RE.match(v) else v)\n\n\ndef _read_csv_raw(file_obj: io.BytesIO) -> pd.DataFrame:\n    \"\"\"Try common CSV separators and encodings, return the raw DataFrame.\n\n    All (encoding, separator) combinations are scored; the cleanest decode\n    (fewest C1 control characters, see _score_encoding) wins, with earlier\n    entries in _CSV_ENCODINGS preferred on ties.\n    \"\"\"\n    data = file_obj.read()\n    best_df: pd.DataFrame | None = None\n    best_score = -1.0\n\n    for enc in _CSV_ENCODINGS:\n        for sep in _CSV_SEPARATORS:\n            try:\n                df = pd.read_csv(\n                    io.BytesIO(data),\n                    sep=sep,\n                    header=None,\n                    dtype=str,\n                    encoding=enc,\n                    on_bad_lines=\"skip\",\n                )\n            except Exception:\n                continue\n            if df.shape[1] <= 1:\n                continue\n            score = _score_encoding(df) * 1000 + df.shape[1]\n            if score > best_score:\n                best_score = score\n                best_df = df\n\n    if best_df is not None:\n        return best_df\n    # fallback\n    return pd.read_csv(io.BytesIO(data), header=None, dtype=str, on_bad_lines=\"skip\")\n\n\n_CP1252_SPECIALS = set(\"€‚ƒ„…†‡ˆ‰Š‹ŒŽ''\"\"•–—˜™š›œžŸ\")\n\n\ndef _score_encoding(df: pd.DataFrame) -> float:\n    \"\"\"Penalize decodes that show signs of being the wrong single-byte code page.\n\n    Two independent tells are checked, since DOS/OEM code pages (e.g. CP850)\n    and Windows-1252/Latin-1 disagree specifically in the 0x80-0x9F byte range:\n\n    - CP850 places accented letters (Ä, Ö, ...) exactly where Latin-1 decodes\n      invisible Unicode C1 control characters (U+0080-U+009F).\n    - The same bytes decode under CP1252 to real but rare typographic symbols\n      (curly quotes, em-dash, Ž, ™, ...). Genuine Finnish business text never\n      has those symbols *in the middle of a word*, so seeing one flanked by\n      letters on both sides is a strong signal that an accented letter (Ä, Ö,\n      Å, ...) was actually intended - i.e. the encoding is wrong.\n    \"\"\"\n    bad = 0\n    total = 0\n    for col in df.columns:\n        for v in df[col]:\n            if not isinstance(v, str) or not v:\n                continue\n            total += 1\n            has_c1 = any(0x80 <= ord(ch) <= 0x9F for ch in v)\n            has_midword_special = any(\n                ch in _CP1252_SPECIALS and 0 < i < len(v) - 1\n                and v[i - 1].isalpha() and v[i + 1].isalpha()\n                for i, ch in enumerate(v)\n            )\n            if has_c1 or has_midword_special:\n                bad += 1\n    if total == 0:\n        return 0.0\n    return 1.0 - (bad / total)\n\n\ndef detect_header_row(raw: pd.DataFrame, scan_rows: int = 12) -> int:\n    \"\"\"\n    Return the 0-based row index most likely to be the header.\n    Heuristic: the row in the first `scan_rows` rows with the most\n    non-null, non-numeric string cells.\n    \"\"\"\n    best_row = 0\n    best_score = -1\n    limit = min(scan_rows, len(raw))\n    for i in range(limit):\n        row = raw.iloc[i]\n        score = sum(\n            1\n            for v in row\n            if isinstance(v, str) and v.strip() and not _is_numeric(v.strip())\n        )\n        if score > best_score:\n            best_score = score\n            best_row = i\n    return best_row\n\n\ndef apply_header(raw: pd.DataFrame, header_row: int) -> pd.DataFrame:\n    \"\"\"Return a DataFrame with the given row promoted to column names.\"\"\"\n    headers = [str(v).strip() if pd.notna(v) and str(v).strip() else f\"Sarake_{i}\"\n               for i, v in enumerate(raw.iloc[header_row])]\n    # deduplicate\n    seen: dict[str, int] = {}\n    unique: list[str] = []\n    for h in headers:\n        if h in seen:\n            seen[h] += 1\n            unique.append(f\"{h}_{seen[h]}\")\n        else:\n            seen[h] = 0\n            unique.append(h)\n    df = raw.iloc[header_row + 1:].copy()\n    df.columns = unique\n    df = df.reset_index(drop=True)\n    return df\n\n\ndef _is_numeric(s: str) -> bool:\n    try:\n        float(s.replace(\",\", \".\"))\n        return True\n    except ValueError:\n        return False\n",
      "converter/column_mapper.py": "\"\"\"\nRule-based fuzzy column mapping: source column names → ERP field names.\nUses difflib for approximate string matching against the synonym table.\n\"\"\"\nfrom __future__ import annotations\n\nimport difflib\nimport re\n\nfrom config.field_synonyms import SYNONYMS, ERP_FIELD_ORDER, FIELD_VALUE_PATTERNS\nfrom config.locales import COLUMN_TRANSLATIONS\n\n# Sentinel for \"not mapped\"\nNO_MAPPING = \"\"\n\n# Augment SYNONYMS with translated field names from all languages.\n# Also ensures every ERP field has at least its own FI name as a synonym,\n# so fields not manually listed in SYNONYMS are still matchable.\nfor _fi_name in ERP_FIELD_ORDER:\n    _entry = SYNONYMS.setdefault(_fi_name, [_fi_name.lower()])\n    for _translations in COLUMN_TRANSLATIONS.values():\n        _translated = _translations.get(_fi_name, \"\").lower()\n        if _translated and _translated not in _entry:\n            _entry.append(_translated)\n\n_VALUE_VALIDATORS = {\n    field: re.compile(pattern) for field, pattern in FIELD_VALUE_PATTERNS.items()\n}\n\n\ndef _values_confirm(field: str, sample_values: list[str] | None) -> bool:\n    \"\"\"\n    Return False only when enough sample values are available to confidently\n    reject a fuzzy (non-exact) match - e.g. a column named \"Yritystunnus\"\n    whose values don't actually look like Finnish business IDs, and are\n    therefore a running customer number rather than a Y-tunnus.\n    \"\"\"\n    validator = _VALUE_VALIDATORS.get(field)\n    if validator is None or not sample_values:\n        return True\n    cleaned = [\n        v.strip() for v in sample_values\n        if v and str(v).strip().lower() not in (\"nan\", \"none\")\n    ]\n    if not cleaned:\n        return True\n    ok = sum(1 for v in cleaned if validator.fullmatch(v))\n    return (ok / len(cleaned)) >= 0.5\n\n\ndef auto_map(\n    source_columns: list[str],\n    sample_values: dict[str, list[str]] | None = None,\n) -> dict[str, str]:\n    \"\"\"\n    Return {source_col: erp_field} for every source column that has a\n    confident match. Columns without a match get NO_MAPPING.\n    Already-taken ERP fields won't be assigned a second time (first-wins).\n\n    `sample_values`, when given, maps a source column to a handful of its raw\n    cell values. It is only consulted for fuzzy (non-exact) matches on fields\n    listed in FIELD_VALUE_PATTERNS, to veto misleading column names.\n    \"\"\"\n    taken: set[str] = set()\n    result: dict[str, str] = {}\n\n    for src in source_columns:\n        src_norm = src.strip().lower()\n        best_field = NO_MAPPING\n        best_score = 0.0\n        best_exact = False\n\n        for erp_field, synonyms in SYNONYMS.items():\n            if erp_field in taken:\n                continue\n            # Exact match first\n            if src_norm in synonyms:\n                best_field = erp_field\n                best_score = 1.0\n                best_exact = True\n                break\n            # Fuzzy match\n            matches = difflib.get_close_matches(src_norm, synonyms, n=1, cutoff=0.75)\n            if matches:\n                score = difflib.SequenceMatcher(None, src_norm, matches[0]).ratio()\n                if score > best_score:\n                    best_score = score\n                    best_field = erp_field\n                    best_exact = False\n\n        if best_field and not best_exact:\n            values = sample_values.get(src) if sample_values else None\n            if not _values_confirm(best_field, values):\n                best_field = NO_MAPPING\n\n        if best_field:\n            taken.add(best_field)\n        result[src] = best_field\n\n    return result\n\n\ndef erp_fields_in_order() -> list[str]:\n    return list(ERP_FIELD_ORDER)\n\n\ndef available_erp_fields(already_mapped: set[str]) -> list[str]:\n    \"\"\"Return ERP fields not yet assigned, in canonical order.\"\"\"\n    return [f for f in ERP_FIELD_ORDER if f not in already_mapped]\n",
      "converter/value_mapper.py": "\"\"\"Best-effort guessing for the fixed-option value-mapping UI (Asiakastyyppi,\nAsiakkaan kieli, Asiakkaan maa) - matches column_mapper.auto_map()'s\nexact-then-fuzzy approach, but at the value level instead of the column-name\nlevel.\n\"\"\"\nfrom __future__ import annotations\n\nfrom difflib import get_close_matches\n\n\ndef guess_fixed_option(value: str, options: dict[str, str], cutoff: float = 0.6) -> str | None:\n    \"\"\"Best guess of which `options` label a raw source value corresponds to.\n\n    Returns the matching label (dict key), or None if no confident guess.\n    Tries an exact case-insensitive match against the code or the label first,\n    then falls back to fuzzy matching against the labels.\n    \"\"\"\n    v = value.strip().lower()\n    if not v:\n        return None\n\n    for label, code in options.items():\n        if v == code.strip().lower() or v == label.strip().lower():\n            return label\n\n    # Prefix/substring containment before fuzzy ratio: a source value like\n    # \"Yritysasiakas\" should resolve to \"Yritys\", not to the unrelated but\n    # longer \"Yksityisasiakas\" - which SequenceMatcher would otherwise prefer\n    # purely because both share the \"asiakas\" suffix.\n    prefix_hits = [\n        label for label, code in options.items()\n        if v.startswith(label.strip().lower()) or label.strip().lower().startswith(v)\n    ]\n    if prefix_hits:\n        return max(prefix_hits, key=len)\n\n    matches = get_close_matches(value.strip(), list(options.keys()), n=1, cutoff=cutoff)\n    return matches[0] if matches else None\n",
      "converter/transformer.py": "\"\"\"\nData transformation pipeline:\n  - Merge multiple source columns mapped to the same ERP field (e.g. split\n    first/last name columns feeding into Nimi)\n  - Apply column mapping → rename source columns to ERP field names\n  - Fix known Easoft customer-import data issues (Fennoa-style Nro, missing\n    e-invoice leading zeros, zero-padded postal codes)\n  - Apply default values (Ryhmä)\n  - Auto-number Nro when missing (optional)\n  - Validate rows and attach severity flags\n\nCombined-field splitting (one source column holding two ERP fields' worth of\ndata) is handled separately by split_combined_column(), called by the UI\n*before* this pipeline runs - its output columns are just regular source\ncolumns by the time build_transformed_df() sees them.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass, field\nfrom typing import Optional\n\nimport pandas as pd\n\nfrom config.erp_options import FIXED_OPTION_FIELDS\nfrom config.field_synonyms import ERP_REQUIRED_FIELDS, FIELD_VALUE_PATTERNS  # noqa: F401 (re-exported)\n\n_DEFAULT_MESSAGES: dict[str, str] = {\n    \"msg_nimi_empty\": \"Nimi on tyhjä\",\n    \"msg_nro_not_numeric\": \"Nro sisältää muita kuin numeromerkkejä: {value}\",\n    \"msg_nro_duplicate\": \"Nro '{value}' esiintyy jo rivillä {row}\",\n    \"msg_ytunnus_format\": \"Y-tunnus ei ole odotetussa muodossa: {value}\",\n    \"msg_einvoice_not_numeric\": \"{field} ei ole numeerinen etunollakorjauksen jälkeen: {value}\",\n    \"msg_einvoice_email_not_allowed\": \"{field} sisältää sähköpostiosoitteen, mutta Easoft ei hyväksy sitä tähän kenttään: {value}\",\n    \"msg_fixed_option_invalid\": \"{field}-kentän arvo '{value}' ei ole sallittu Easoft-koodi\",\n    \"msg_postal_code_format\": \"{field} ei ole 5 numeroa (Suomen postinumeromuoto): {value}\",\n}\n\n# Validation issue levels\nERROR = \"error\"\nWARNING = \"warning\"\n\n_BLANK = (\"\", \"nan\", \"none\")\n\n_EINVOICE_FIELDS = (\"Verkkolaskuosoite\", \"Välittäjän tunnus\")\n\nCOMBINED_FIELD_MODES = [\n    \"einvoice_space\",\n    \"einvoice_name_paren\",\n    \"einvoice_email_or_ovt\",\n    \"einvoice_at_sign\",\n    \"address_zip_city\",\n]\n\n\n@dataclass\nclass ValidationIssue:\n    row_idx: int\n    field: str\n    level: str  # \"error\" | \"warning\"\n    message: str\n\n\n@dataclass\nclass TransformResult:\n    df: pd.DataFrame\n    issues: list[ValidationIssue] = field(default_factory=list)\n\n\ndef _is_blank(v) -> bool:\n    return not str(v).strip() or str(v).strip().lower() in _BLANK\n\n\ndef _clean(v) -> str:\n    s = str(v).strip()\n    return \"\" if s.lower() in _BLANK else s\n\n\ndef clean_value(v) -> str:\n    \"\"\"Public alias of _clean() - callers outside this module (e.g. app.py's\n    value-mapping UI) must use this exact normalization when collecting\n    distinct source values, since apply_value_maps() uses the same function\n    as its dict lookup key. Using a different normalization would make\n    values silently fail to match.\"\"\"\n    return _clean(v)\n\n\n# ── Combined-field splitting ─────────────────────────────────────────────────\n\ndef split_combined_column(\n    series: pd.Series, mode: str, *, email_target: str = \"Email\"\n) -> dict[str, tuple[str, pd.Series]]:\n    \"\"\"\n    Split a single source column that packs more than one ERP field's worth\n    of data into one cell. Returns {derived_column_label: (target_erp_field, values)}\n    so the caller can add the derived columns to the working dataframe and\n    wire the mapping directly (no reliance on fuzzy name matching).\n    \"\"\"\n    if mode == \"einvoice_space\":\n        def _pair(v):\n            parts = _clean(v).split()\n            if len(parts) >= 2:\n                return parts[0], parts[1]\n            return \"\", (parts[0] if parts else \"\")\n        pairs = series.map(_pair)\n        return {\n            \"Välittäjän tunnus (poimittu)\": (\"Välittäjän tunnus\", pairs.map(lambda p: p[0])),\n            \"Verkkolaskuosoite (poimittu)\": (\"Verkkolaskuosoite\", pairs.map(lambda p: p[1])),\n        }\n\n    if mode == \"einvoice_name_paren\":\n        pattern = re.compile(r\"\\((\\d+)\\)\\s*$\")\n\n        def _extract(v):\n            s = _clean(v)\n            m = pattern.search(s)\n            if m:\n                return m.group(1)\n            return s if s.isdigit() else \"\"\n\n        return {\n            \"Välittäjän tunnus (poimittu)\": (\"Välittäjän tunnus\", series.map(_extract)),\n        }\n\n    if mode == \"einvoice_email_or_ovt\":\n        def _ovt(v):\n            s = _clean(v)\n            return \"\" if \"@\" in s else s\n\n        def _email(v):\n            s = _clean(v)\n            return s if \"@\" in s else \"\"\n\n        return {\n            \"Verkkolaskuosoite (poimittu)\": (\"Verkkolaskuosoite\", series.map(_ovt)),\n            f\"{email_target} (poimittu)\": (email_target, series.map(_email)),\n        }\n\n    if mode == \"einvoice_at_sign\":\n        def _pair(v):\n            s = _clean(v)\n            if \"@\" in s:\n                left, right = s.split(\"@\", 1)\n                return left, right\n            return s, \"\"\n        pairs = series.map(_pair)\n        return {\n            \"Verkkolaskuosoite (poimittu)\": (\"Verkkolaskuosoite\", pairs.map(lambda p: p[0])),\n            \"Välittäjän tunnus (poimittu)\": (\"Välittäjän tunnus\", pairs.map(lambda p: p[1])),\n        }\n\n    if mode == \"address_zip_city\":\n        pattern = re.compile(r\"^\\s*(\\d{5})\\s+(.+)$\")\n\n        def _zip(v):\n            m = pattern.match(_clean(v))\n            return m.group(1) if m else \"\"\n\n        def _city(v):\n            s = _clean(v)\n            m = pattern.match(s)\n            return m.group(2).strip() if m else s\n\n        return {\n            \"Postinro (poimittu)\": (\"Postinro\", series.map(_zip)),\n            \"Postitp (poimittu)\": (\"Postitp\", series.map(_city)),\n        }\n\n    raise ValueError(f\"Tuntematon yhdistelmäkentän tyyppi: {mode}\")\n\n\n# ── Multi-column merge (e.g. first name + last name → Nimi) ──────────────────\n\ndef merge_multi_mapped_columns(\n    df: pd.DataFrame,\n    mapping: dict[str, str],\n    merge_order: dict[str, list[str]],\n) -> tuple[pd.DataFrame, dict[str, str]]:\n    \"\"\"\n    For ERP fields that have more than one source column assigned to them,\n    join the values with a space in the given order and collapse them into a\n    single synthetic column, so the rest of the pipeline only ever sees one\n    source column per ERP field. `merge_order` maps erp_field -> ordered list\n    of source column names.\n    \"\"\"\n    df = df.copy()\n    mapping = dict(mapping)\n\n    for erp_field, cols in merge_order.items():\n        cols = [c for c in cols if c in df.columns]\n        if len(cols) < 2:\n            continue\n        merged_name = f\"__merged__{erp_field}\"\n\n        def _join(row, cols=cols):\n            parts = [str(row[c]).strip() for c in cols if not _is_blank(row[c])]\n            return \" \".join(parts)\n\n        df[merged_name] = df.apply(_join, axis=1)\n        for c in cols:\n            mapping.pop(c, None)\n        mapping[merged_name] = erp_field\n\n    return df, mapping\n\n\ndef apply_mapping(df: pd.DataFrame, mapping: dict[str, str]) -> pd.DataFrame:\n    \"\"\"Rename source columns according to the mapping; drop unmapped columns.\"\"\"\n    rename = {src: dst for src, dst in mapping.items() if dst}\n    df = df.rename(columns=rename)\n    keep = [c for c in df.columns if c in rename.values()]\n    result = df[keep].copy()\n    result = result.loc[:, ~result.columns.duplicated(keep=\"last\")]\n    return result\n\n\n# ── Field-specific fixes ─────────────────────────────────────────────────────\n\ndef looks_like_fennoa_nro(values, threshold: float = 0.2) -> bool:\n    \"\"\"True when a meaningful share of values look like 'F0012' (letter prefix).\"\"\"\n    cleaned = [_clean(v) for v in values]\n    cleaned = [v for v in cleaned if v]\n    if not cleaned:\n        return False\n    hits = sum(1 for v in cleaned if re.fullmatch(r\"[A-Za-z]+0*\\d+\", v))\n    return (hits / len(cleaned)) >= threshold\n\n\ndef _fix_fennoa_nro(val) -> str:\n    s = _clean(val)\n    if not s:\n        return \"\"\n    m = re.match(r\"^[A-Za-z]*0*(\\d+)$\", s)\n    if m:\n        return str(int(m.group(1)))\n    return s\n\n\ndef _fix_einvoice_zeros(val) -> str:\n    s = _clean(val)\n    if not s or \"@\" in s:\n        return s\n    digits = s.replace(\" \", \"\")\n    if digits.isdigit() and not digits.startswith(\"00\"):\n        return \"00\" + digits\n    return s\n\n\ndef _effective_country(row, default_country: str) -> str:\n    \"\"\"The country used to decide whether Finland-specific fixes/validations\n    (e-invoice leading zeros, postal code format) apply to this row: the\n    row's own mapped Asiakkaan maa if set, otherwise the form-wide default\n    country setting, otherwise Finland. Source files rarely fill in\n    Asiakkaan maa per row (a whole import is typically one country), hence\n    the form-wide fallback instead of just defaulting blank rows to \"FI\".\n\n    To add a second country's own rule set later, branch on its code next\n    to the \"FI\" checks in build_transformed_df()/_validate() - no registry\n    needed for a single additional country.\n    \"\"\"\n    maa = _clean(row.get(\"Asiakkaan maa\", \"\"))\n    return maa if maa else (default_country or \"FI\")\n\n\ndef apply_value_maps(df: pd.DataFrame, value_maps: dict[str, dict[str, str]] | None) -> pd.DataFrame:\n    \"\"\"Substitute source values with their mapped Easoft values for the\n    fields covered by the Section 3 value-mapping UI (fixed-option fields\n    like Asiakastyyppi, and free-text fields like Maksuehto). Values not\n    present in a field's map pass through unchanged.\"\"\"\n    if not value_maps:\n        return df\n    for erp_field, vmap in value_maps.items():\n        if erp_field not in df.columns or not vmap:\n            continue\n\n        def _map(v, vmap=vmap):\n            s = clean_value(v)\n            return vmap.get(s, s)\n\n        df[erp_field] = df[erp_field].apply(_map)\n    return df\n\n\ndef _normalize_postal_code(val) -> str:\n    \"\"\"\n    Finnish postal codes are always exactly 5 digits. Excel/xlrd sometimes\n    stores them as numbers instead of text, which silently drops leading\n    zeros (e.g. '04430' becomes 4430, or '00021' becomes 21) - restorable\n    by re-padding to 5 digits. A rarer opposite artefact seen in the wild\n    is a 7-digit, zero-padded numeric field ('0033700' for '33700') - also\n    deterministically fixable.\n    \"\"\"\n    s = _clean(val)\n    if not s.isdigit():\n        return s\n    if len(s) == 7 and s.startswith(\"00\"):\n        return s[-5:]\n    if 0 < len(s) < 5:\n        return s.zfill(5)\n    return s\n\n\n# ── Main pipeline ─────────────────────────────────────────────────────────────\n\ndef build_transformed_df(\n    raw_df: pd.DataFrame,\n    mapping: dict[str, str],\n    *,\n    ryhma_default: str = \"\",\n    nro_mode: str = \"mapped\",  # \"mapped\" | \"empty\" | \"auto\"\n    auto_nro_start: Optional[int] = None,\n    auto_nro_interval: int = 1,\n    fix_fennoa_nro: bool = False,\n    fix_einvoice_zeros: bool = True,\n    value_maps: dict[str, dict[str, str]] | None = None,\n    default_country: str = \"\",\n    messages: dict[str, str] | None = None,\n) -> TransformResult:\n    \"\"\"Full transformation pipeline.\"\"\"\n\n    # 1. Apply column mapping (rename + drop unmapped)\n    df = apply_mapping(raw_df, mapping)\n    df = df.reset_index(drop=True)\n\n    # 1b. Value-level mapping (Asiakastyyppi/kieli/maa selectbox choices,\n    # Maksuehto/Laskun lähetystapa free-text passthrough table)\n    df = apply_value_maps(df, value_maps)\n\n    # 2. Drop rows where every mapped field is blank\n    non_empty_mask = df.apply(lambda row: any(not _is_blank(v) for v in row.values), axis=1)\n    df = df[non_empty_mask].reset_index(drop=True)\n\n    # 3. Default values\n    _ensure_col(df, \"Ryhmä\", ryhma_default)\n\n    # 4. Nro handling\n    if \"Nro\" not in df.columns:\n        df[\"Nro\"] = \"\"\n    if fix_fennoa_nro:\n        df[\"Nro\"] = df[\"Nro\"].apply(_fix_fennoa_nro)\n    if nro_mode == \"empty\":\n        df[\"Nro\"] = \"\"\n    elif nro_mode == \"auto\" and auto_nro_start is not None:\n        df[\"Nro\"] = [str(auto_nro_start + i * auto_nro_interval) for i in range(len(df))]\n\n    # 4b. Effective country per row - gates the Finland-specific fixes/\n    # validations below (see _effective_country() docstring).\n    country_series = df.apply(lambda r: _effective_country(r, default_country), axis=1)\n    is_fi = country_series == \"FI\"\n\n    # 5. E-invoice leading-zero fix (Finland only)\n    if fix_einvoice_zeros:\n        for col in _EINVOICE_FIELDS:\n            if col in df.columns:\n                df[col] = [\n                    _fix_einvoice_zeros(v) if fi else v\n                    for v, fi in zip(df[col], is_fi)\n                ]\n\n    # 6. Postal code de-padding (7-digit zero-padded artefact → 5 digits) -\n    # Finland only; other countries' postal formats differ enough (4-digit\n    # Norway/Denmark, \"XX-XXX\" Poland, ...) that this heuristic would corrupt\n    # a legitimate foreign code instead of fixing anything.\n    for col in (\"Postinro\", \"Laskutus postinumero\"):\n        if col in df.columns:\n            df[col] = [\n                _normalize_postal_code(v) if fi else v\n                for v, fi in zip(df[col], is_fi)\n            ]\n\n    # 7. Trim all text cells\n    for col in df.columns:\n        df[col] = df[col].apply(_clean)\n\n    # 8. Validate\n    msgs = {**_DEFAULT_MESSAGES, **(messages or {})}\n    issues = _validate(df, msgs, country_series)\n\n    return TransformResult(df=df, issues=issues)\n\n\n# ── helpers ──────────────────────────────────────────────────────────────────\n\ndef _mapped_src(mapping: dict[str, str], erp_field: str) -> Optional[str]:\n    for src, dst in mapping.items():\n        if dst == erp_field:\n            return src\n    return None\n\n\ndef _ensure_col(df: pd.DataFrame, col: str, default: str) -> None:\n    if col not in df.columns:\n        df[col] = default\n    else:\n        mask = df[col].isna() | (df[col].astype(str).str.strip() == \"\")\n        df.loc[mask, col] = default\n\n\n_POSTAL_FIELDS = (\"Postinro\", \"Laskutus postinumero\")\n\n# PO box notations (e.g. \"PL 55\") are conventionally written into the postal\n# code field rather than the street address in this source data - these\n# aren't a malformed postal code, so the format check below skips them.\n_PO_BOX_PATTERN = re.compile(r\"^(PL|POSTILOKERO)\\b\", re.IGNORECASE)\n\n\ndef _validate(df: pd.DataFrame, msgs: dict[str, str], country_series=None) -> list[ValidationIssue]:\n    issues: list[ValidationIssue] = []\n    seen_nro: dict[str, int] = {}\n    ytunnus_pattern = re.compile(FIELD_VALUE_PATTERNS.get(\"Y-tunnus\", r\".*\"))\n    fixed_option_codes = {\n        field: set(options.values()) for field, options in FIXED_OPTION_FIELDS.items()\n    }\n    if country_series is None:\n        country_series = pd.Series([\"FI\"] * len(df), index=df.index)\n\n    for i, row in df.iterrows():\n        is_fi = country_series[i] == \"FI\"\n        # Nimi\n        nimi = _clean(row.get(\"Nimi\", \"\"))\n        if not nimi:\n            issues.append(ValidationIssue(i, \"Nimi\", ERROR, msgs[\"msg_nimi_empty\"]))\n\n        # Nro\n        nro = _clean(row.get(\"Nro\", \"\"))\n        if nro:\n            if not re.fullmatch(r\"\\d+\", nro):\n                issues.append(\n                    ValidationIssue(i, \"Nro\", ERROR,\n                                    msgs[\"msg_nro_not_numeric\"].format(value=nro))\n                )\n            elif nro in seen_nro:\n                issues.append(\n                    ValidationIssue(i, \"Nro\", WARNING,\n                                    msgs[\"msg_nro_duplicate\"].format(\n                                        value=nro, row=seen_nro[nro] + 1))\n                )\n            else:\n                seen_nro[nro] = i\n\n        # Y-tunnus (best-effort format check; format varies enough to only warn)\n        ytunnus = _clean(row.get(\"Y-tunnus\", \"\"))\n        if ytunnus and not ytunnus_pattern.fullmatch(ytunnus):\n            issues.append(\n                ValidationIssue(i, \"Y-tunnus\", WARNING,\n                                 msgs[\"msg_ytunnus_format\"].format(value=ytunnus))\n            )\n\n        # E-invoice fields: should be numeric once the leading-zero fix ran.\n        # Easoft never accepts an email address here - if one still ended up\n        # in Verkkolaskuosoite/Välittäjän tunnus, the source column should\n        # have been split via the einvoice_email_or_ovt combined-field mode\n        # instead of mapped directly.\n        for ecol in _EINVOICE_FIELDS:\n            val = _clean(row.get(ecol, \"\"))\n            if not val:\n                continue\n            if \"@\" in val:\n                issues.append(\n                    ValidationIssue(i, ecol, ERROR,\n                                     msgs[\"msg_einvoice_email_not_allowed\"].format(field=ecol, value=val))\n                )\n            elif is_fi and not re.fullmatch(r\"\\d+\", val):\n                issues.append(\n                    ValidationIssue(i, ecol, WARNING,\n                                     msgs[\"msg_einvoice_not_numeric\"].format(field=ecol, value=val))\n                )\n\n        # Postal code format (Finland only - 5 digits). Other countries'\n        # formats vary too much (4-digit Norway/Denmark, \"XX-XXX\" Poland, ...)\n        # to validate without their own explicit rule.\n        if is_fi:\n            for pcol in _POSTAL_FIELDS:\n                val = _clean(row.get(pcol, \"\"))\n                if val and not _PO_BOX_PATTERN.match(val) and not re.fullmatch(r\"\\d{5}\", val):\n                    issues.append(\n                        ValidationIssue(i, pcol, WARNING,\n                                         msgs[\"msg_postal_code_format\"].format(field=pcol, value=val))\n                    )\n\n        # Fixed-option fields (Asiakastyyppi/Asiakkaan kieli/Asiakkaan maa):\n        # a non-blank value that isn't one of Easoft's own codes usually\n        # means the value-mapping selectbox was left unresolved and the\n        # user typed something in manually instead, or the field was mapped\n        # directly without going through Section 3 at all.\n        for field_name, codes in fixed_option_codes.items():\n            val = _clean(row.get(field_name, \"\"))\n            if val and val not in codes:\n                issues.append(\n                    ValidationIssue(i, field_name, WARNING,\n                                     msgs[\"msg_fixed_option_invalid\"].format(field=field_name, value=val))\n                )\n\n    return issues\n",
      "converter/exporter.py": "\"\"\"Builds the semicolon-delimited ERP output CSV.\n\nUnlike the product register tool, Easoft's customer import samples\n(sample_files/output-sample/*.csv) are ISO-8859-1 encoded with bare LF line\nendings, not UTF-8/CRLF - verified byte-for-byte against all four language\nvariants.\n\"\"\"\nfrom __future__ import annotations\n\nimport io\nimport zipfile\n\nimport pandas as pd\n\nfrom config.field_synonyms import ERP_FIELD_ORDER, ERP_REQUIRED_FIELDS\nfrom config.locales import COLUMN_TRANSLATIONS\n\n\ndef build_output(\n    df: pd.DataFrame,\n    selected_fields: list[str],\n    language: str = \"FI\",\n) -> pd.DataFrame:\n    \"\"\"\n    Return a DataFrame with columns in ERP canonical order.\n    Only includes required fields + selected optional fields.\n    Columns missing from df are added as empty strings.\n    \"\"\"\n    # Always include required fields; merge with user selection preserving order\n    all_fields = ERP_REQUIRED_FIELDS + [\n        f for f in selected_fields if f not in ERP_REQUIRED_FIELDS\n    ]\n    # Re-apply canonical order\n    ordered = [f for f in ERP_FIELD_ORDER if f in all_fields]\n\n    out = pd.DataFrame()\n    for col in ordered:\n        if col in df.columns:\n            out[col] = df[col].fillna(\"\").astype(str).str.strip()\n        else:\n            out[col] = \"\"\n\n    translations = COLUMN_TRANSLATIONS.get(language, {})\n    if language != \"FI\" and translations:\n        out = out.rename(columns={k: v for k, v in translations.items() if k in out.columns})\n\n    return out\n\n\ndef to_csv_bytes(df: pd.DataFrame) -> bytes:\n    \"\"\"Return ISO-8859-1 CSV bytes with semicolon separator and LF line endings.\"\"\"\n    buf = io.StringIO()\n    df.to_csv(buf, sep=\";\", index=False, lineterminator=\"\\n\")\n    return buf.getvalue().encode(\"iso-8859-1\", errors=\"replace\")\n\n\ndef to_zip_bytes(files: dict[str, bytes]) -> bytes:\n    \"\"\"Return an in-memory ZIP archive containing the given named files.\"\"\"\n    buf = io.BytesIO()\n    with zipfile.ZipFile(buf, \"w\", zipfile.ZIP_DEFLATED) as zf:\n        for name, data in files.items():\n            zf.writestr(name, data)\n    return buf.getvalue()\n",
      "config/field_synonyms.py": "\"\"\"\nMapping from ERP output field name → list of known synonyms in source files.\nLower-case matching is applied; add more synonyms as new customers are onboarded.\n\"\"\"\n\n# ERP output field order (matches sample_files/output-sample/output_sample_FI.csv exactly)\nERP_FIELD_ORDER = [\n    \"Nro\",\n    \"Nimi\",\n    \"Nimi2\",\n    \"Osoite\",\n    \"Postinro\",\n    \"Postitp\",\n    \"Puhelin\",\n    \"Puhelin2\",\n    \"Email\",\n    \"Y-tunnus\",\n    \"ALV-tunnus\",\n    \"Ryhmä\",\n    \"Tila\",\n    \"Oma edustaja\",\n    \"Asiakkaan kieli\",\n    \"Asiakkaan maa\",\n    \"Laskutus nimi\",\n    \"Laskutus nimi2\",\n    \"Laskutus osoite\",\n    \"Laskutus postinumero\",\n    \"Laskutus postitoimipaikka\",\n    \"Laskutus puhelin1\",\n    \"Laskutus email\",\n    \"Myyntialue\",\n    \"Maksuehto\",\n    \"Ale-%\",\n    \"Kate-%\",\n    \"Asiakastyyppi\",\n    \"Verkkolaskuosoite\",\n    \"Välittäjän tunnus\",\n    \"Mitä kautta tullut\",\n    \"Markkinointilupa\",\n    \"Huomiot\",\n    \"Laskun lähetystapa\",\n    \"Maksumuistutus\",\n    \"Aktiivinen\",\n    \"Organisaationumero\",\n    \"Alv-käsittely\",\n    \"Toimitustapa\",\n    \"Toimitusehto\",\n    \"Toimituskielto\",\n]\n\n# Only Nimi is a true hard requirement for a successful Easoft import;\n# Easoft assigns the next running Nro itself when it is left empty.\nERP_REQUIRED_FIELDS = [\"Nimi\"]\n\n# Fields for which the auto-mapped column's *values* are checked before the\n# mapping is trusted (guards against misleading source column names, e.g. a\n# column literally called \"Yritystunnus\" that actually holds a running\n# customer number instead of a Finnish business ID).\nFIELD_VALUE_PATTERNS: dict[str, str] = {\n    \"Y-tunnus\": r\"\\d{6,8}-?\\d\",\n    \"Email\": r\"[^@\\s]+@[^@\\s]+\\.[^@\\s]+\",\n    \"Laskutus email\": r\"[^@\\s]+@[^@\\s]+\\.[^@\\s]+\",\n}\n\n# ERP fields whose Easoft dropdown options are NOT fully known (unlike\n# Asiakastyyppi/Asiakkaan kieli/Asiakkaan maa - see config/erp_options.py) -\n# the value-mapping UI in app.py offers a free-text passthrough table for\n# these instead of a selectbox. See docs/fetch_options.md for a possible\n# future automation of fetching Easoft's real option lists.\nFREE_TEXT_VALUE_FIELDS: list[str] = [\n    \"Maksuehto\",\n    \"Laskun lähetystapa\",\n]\n\nSYNONYMS: dict[str, list[str]] = {\n    \"Nro\": [\n        \"nro\", \"numero\", \"asiakasnumero\", \"asiakasnro\", \"asiakas nro\",\n        \"asiakaskoodi\", \"koodi\", \"id\", \"customer number\",\n        \"customer no\", \"customer no.\", \"customer id\", \"no.\", \"nr\", \"nr.\",\n        \"customer_no\",\n    ],\n    \"Nimi\": [\n        \"nimi\", \"asiakkaan nimi\", \"nimi1\", \"nimi 1\", \"name\", \"company name\",\n        \"asiakasnimi\", \"yrityksen nimi\",\n    ],\n    \"Nimi2\": [\n        \"nimi2\", \"nimi 2\", \"nimijatko\", \"nimen jatko\", \"nimi-2\", \"name2\",\n    ],\n    \"Osoite\": [\n        \"osoite\", \"katuosoite\", \"lähiosoite\", \"lahiosoite\", \"streetname\",\n        \"address\", \"käyntiosoite\",\n    ],\n    \"Postinro\": [\n        \"postinro\", \"postinumero\", \"pnro\", \"postal code\", \"postcode\",\n        \"zipcode\", \"postnr\", \"postnummer\",\n    ],\n    \"Postitp\": [\n        \"postitp\", \"postitoimipaikka\", \"ppaikka\", \"kaupunki\", \"city\",\n        \"postiosoite1\", \"town/city\", \"postort\",\n    ],\n    \"Puhelin\": [\n        \"puhelin\", \"puh\", \"telephone\", \"tel\", \"puhelin1\", \"telefon\",\n    ],\n    \"Puhelin2\": [\n        \"puhelin2\", \"matkapuhelin\", \"gsm\", \"mobile\", \"telefon2\",\n    ],\n    \"Email\": [\n        \"email\", \"sähköposti\", \"sahkoposti\", \"e-mail\", \"e-post\",\n    ],\n    \"Y-tunnus\": [\n        \"y-tunnus\", \"y_tunnus\", \"business id\", \"vat_no\", \"company-id\",\n        \"org.nr\",\n    ],\n    \"ALV-tunnus\": [\n        \"alv-tunnus\", \"alv tunnus\", \"vat-tunnus\", \"vat number\", \"vat code\",\n        \"alv-numero\",\n    ],\n    \"Ryhmä\": [\n        \"ryhmä\", \"asiakasryhmä\", \"asiakasryhmät\", \"group\", \"gruppering\",\n        \"yritysryhma\", \"group_name\",\n    ],\n    \"Tila\": [\n        \"tila\", \"status\",\n    ],\n    \"Oma edustaja\": [\n        \"oma edustaja\", \"edustaja\", \"own representative\", \"vår representant\",\n        \"oletusmyyjä\",\n    ],\n    \"Asiakkaan kieli\": [\n        \"asiakkaan kieli\", \"kieli\", \"language\", \"laskun kieli\",\n        \"laskutuskieli\", \"customer language\",\n    ],\n    \"Asiakkaan maa\": [\n        \"asiakkaan maa\", \"maa\", \"country\", \"laskutusmaa\", \"kansallisuus\",\n        \"customer's country\", \"maakoodi\",\n    ],\n    \"Laskutus nimi\": [\n        \"laskutus nimi\", \"laskutusnimi\", \"invoicing name\",\n        \"nimi 1 (laskutusoletukset)\",\n    ],\n    \"Laskutus nimi2\": [\n        \"laskutus nimi2\", \"laskutusnimi2\", \"invoicing name2\",\n        \"nimi 2 (laskutusoletukset)\", \"invoice_co\",\n    ],\n    \"Laskutus osoite\": [\n        \"laskutus osoite\", \"laskutusosoite\", \"invoicing address\",\n        \"osoite (laskutusoletukset)\", \"invoice_streetname\",\n    ],\n    \"Laskutus postinumero\": [\n        \"laskutus postinumero\", \"laskutuspostinro\", \"invoicing postcode\",\n        \"postinumero (laskutusoletukset)\", \"invoice_zipcode\",\n    ],\n    \"Laskutus postitoimipaikka\": [\n        \"laskutus postitoimipaikka\", \"laskutuspostitoimipaikka\",\n        \"invoicing town/city\", \"postiosoite (laskutusoletukset)\",\n        \"invoice_city\",\n    ],\n    \"Laskutus puhelin1\": [\n        \"laskutus puhelin1\", \"laskutuspuhelin\", \"invoicing phone1\",\n        \"puhelin (laskutusoletukset)\",\n    ],\n    \"Laskutus email\": [\n        \"laskutus email\", \"laskutussähköposti\", \"invoicing email\",\n        \"sähköpostilaskuosoite\", \"invoice_email\",\n    ],\n    \"Myyntialue\": [\n        \"myyntialue\", \"sales region\", \"säljområde\",\n    ],\n    \"Maksuehto\": [\n        \"maksuehto\", \"maksuaika\", \"payment term\", \"payment_term_days\",\n        \"maksuehdot (myyntiehdot)\", \"maksuehdot\", \"oletusmaksuehto\",\n    ],\n    \"Ale-%\": [\n        \"ale-%\", \"ale %\", \"alennus-%\", \"alennus %\", \"discount-%\",\n        \"discount %\",\n    ],\n    \"Kate-%\": [\n        \"kate-%\", \"kate %\", \"margin %\", \"margin-%\",\n    ],\n    \"Asiakastyyppi\": [\n        \"asiakastyyppi\", \"customer type\", \"kundtyp\",\n    ],\n    \"Verkkolaskuosoite\": [\n        \"verkkolaskuosoite\", \"e-invoice address\", \"ovt\", \"einvoice_no\",\n        \"finvoice-osoite (laskutusoletukset)\",\n    ],\n    \"Välittäjän tunnus\": [\n        \"välittäjän tunnus\", \"välittäjätunnus\", \"operaattori\", \"operator id\",\n        \"einvoice_operator\", \"verkkolaskuoperaattori\",\n        \"välittäjän osoite (laskutusoletukset)\",\n    ],\n    \"Mitä kautta tullut\": [\n        \"mitä kautta tullut\", \"arrival route\", \"lähde\", \"source\",\n    ],\n    \"Markkinointilupa\": [\n        \"markkinointilupa\", \"marketing permission\",\n    ],\n    \"Huomiot\": [\n        \"huomiot\", \"kommentti\", \"kommentarer\", \"notes\", \"comment\",\n        \"asiakasviesti\", \"lisätiedot\", \"lisätieto\", \"selite\",\n        \"invoice_description\", \"muistio (muistio)\", \"oletuslisäselite\",\n        \"asiakaskohtainenviesti\",\n    ],\n    \"Laskun lähetystapa\": [\n        \"laskun lähetystapa\", \"invoice send method\", \"lähetystapa\",\n        \"invoice_delivery_type\",\n    ],\n    \"Maksumuistutus\": [\n        \"maksumuistutus\", \"payment reminder\",\n    ],\n    \"Aktiivinen\": [\n        \"aktiivinen\", \"active\",\n    ],\n    \"Organisaationumero\": [\n        \"organisaationumero\", \"organisaatiotunnus\", \"organisation number\",\n    ],\n    \"Alv-käsittely\": [\n        \"alv-käsittely\", \"vat processing\", \"verotuskäsittely\",\n        \"default_invoice_type\", \"alv-koodi\",\n    ],\n    \"Toimitustapa\": [\n        \"toimitustapa\", \"delivery method\", \"leveranssätt\",\n    ],\n    \"Toimitusehto\": [\n        \"toimitusehto\", \"delivery term\", \"leveransvillkor\",\n    ],\n    \"Toimituskielto\": [\n        \"toimituskielto\", \"delivery block\", \"delivery bock\",\n        \"leverans blockering\",\n    ],\n}\n",
      "config/erp_options.py": "\"\"\"Fixed Easoft dropdown option lists for value-level source-to-target mapping.\n\nThese are Easoft's own fixed vocabularies for a handful of ERP fields whose\nsource-file spelling rarely matches Easoft's exact expected value 1:1 (e.g. a\nsource file might say \"14pv netto\" where Easoft expects \"14pv\"). Unlike\n`FIELD_VALUE_PATTERNS` in field_synonyms.py (which validates column *mapping*),\nthese dicts describe the valid *values* a field may take once mapped, and back\nthe per-value selectbox mapping UI in app.py (Section 3).\n\nCountry/language/customer-type names are intentionally kept in Finnish only,\nregardless of the UI language selected - they are Easoft's own internal option\nlabels (like the ERP_FIELD_ORDER keys), not translatable UI chrome. Codes are\ntranscribed byte-for-byte from docs/asiakasrekisteri_vaihtoehdot.md, including\nits exact casing (kieli = lowercase, maa = uppercase) - Easoft's own import\nexpects these exact values, so don't \"fix\" the casing.\n\"\"\"\nfrom __future__ import annotations\n\n# 1 = Yritys, 2 = Yksityisasiakas, 3 = Koy (fixed Easoft customer-type codes)\nASIAKASTYYPPI_OPTIONS: dict[str, str] = {\n    \"Yritys\": \"1\",\n    \"Yksityisasiakas\": \"2\",\n    \"Koy\": \"3\",\n}\n\n# Source: docs/asiakasrekisteri_vaihtoehdot.md, section \"Asiakkaan kieli\"\nKIELI_OPTIONS: dict[str, str] = {\n    \"Suomi\": \"fi\",\n    \"Ruotsi\": \"sv\",\n    \"Englanti\": \"en\",\n    \"Norja\": \"no\",\n    \"Saksa\": \"de\",\n    \"Puola\": \"pl\",\n}\n\n# Source: docs/asiakasrekisteri_vaihtoehdot.md, section \"Asiakkaan maa\"\nMAA_OPTIONS: dict[str, str] = {\n    \"Afganistan\": \"AF\",\n    \"Ahvenanmaa\": \"AX\",\n    \"Alankomaat\": \"NL\",\n    \"Albania\": \"AL\",\n    \"Algeria\": \"DZ\",\n    \"Amerikan Samoa\": \"AS\",\n    \"Amerikan Yhdysvallat\": \"US\",\n    \"Andorra\": \"AD\",\n    \"Angola\": \"AO\",\n    \"Anguilla\": \"AI\",\n    \"Antarktis\": \"AQ\",\n    \"Antigua ja Barbuda\": \"AG\"       "config/locales.py": "\"\"\"UI strings and ERP field name translations for all supported languages.\n\nTo add a new language: copy one of the _XX dicts, translate all values,\nadd the language code to COLUMN_TRANSLATIONS and LOCALES.\n\"\"\"\nfrom __future__ import annotations\n\n# ── Column translations (FI internal key → output column name) ────────────────\n# Order matches ERP_FIELD_ORDER exactly. Values are taken verbatim from\n# sample_files/output-sample/*.csv, including two known translation slips in\n# the source material (NO \"Postitp\" left untranslated; NO/EN \"bock\" instead\n# of \"block(ering)\") - Easoft's own import expects these exact column names.\n\n_FI_COLS = [\n    \"Nro\", \"Nimi\", \"Nimi2\", \"Osoite\", \"Postinro\", \"Postitp\", \"Puhelin\",\n    \"Puhelin2\", \"Email\", \"Y-tunnus\", \"ALV-tunnus\", \"Ryhmä\", \"Tila\",\n    \"Oma edustaja\", \"Asiakkaan kieli\", \"Asiakkaan maa\", \"Laskutus nimi\",\n    \"Laskutus nimi2\", \"Laskutus osoite\", \"Laskutus postinumero\",\n    \"Laskutus postitoimipaikka\", \"Laskutus puhelin1\", \"Laskutus email\",\n    \"Myyntialue\", \"Maksuehto\", \"Ale-%\", \"Kate-%\", \"Asiakastyyppi\",\n    \"Verkkolaskuosoite\", \"Välittäjän tunnus\", \"Mitä kautta tullut\",\n    \"Markkinointilupa\", \"Huomiot\", \"Laskun lähetystapa\", \"Maksumuistutus\",\n    \"Aktiivinen\", \"Organisaationumero\", \"Alv-käsittely\", \"Toimitustapa\",\n    \"Toimitusehto\", \"Toimituskielto\",\n]\n\n_EN_COLS = [\n    \"No.\", \"Name\", \"Name2\", \"Address\", \"Postcode\", \"Town/city\", \"Telephone\",\n    \"Telephone2\", \"Email\", \"Company-ID\", \"VAT code\", \"Group\", \"Status\",\n    \"Own representative\", \"Customer language\", \"Customer's country\",\n    \"Invoicing name\", \"Invoicing name2\", \"Invoicing address\",\n    \"Invoicing postcode\", \"Invoicing town/city\", \"Invoicing phone1\",\n    \"Invoicing email\", \"Sales region\", \"Payment term\", \"Discount-%\",\n    \"Margin %\", \"Customer type\", \"E-invo async function tryUnlock() {
  const val  = document.getElementById("pw-input").value;
  const hash = await sha256(val);
  if (hash === PASSWORD_HASH) {
    sessionStorage.setItem(SESSION_KEY, "1");
    mountApp();
  } else {
    const box = document.getElementById("lock-box");
    document.getElementById("pw-error").textContent = "Incorrect password.";
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
    document.getElementById("pw-input").select();
  }
}

if (!PASSWORD_HASH || sessionStorage.getItem(SESSION_KEY) === "1") {
  mountApp();
} else {
  document.getElementById("pw-btn").addEventListener("click", tryUnlock);
  document.getElementById("pw-input").addEventListener("keydown", e => {
    if (e.key === "Enter") tryUnlock();
  });
}
